# MCP OAuth Gateway - SWAG Edition
# Auth service + MCP services, routed through SWAG reverse proxy

# Shared YAML anchors for all included service compose files
x-mcp-common: &mcp-common
  restart: unless-stopped
  env_file: .env
  networks:
    - mcp-net

x-mcp-healthcheck: &mcp-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5

include:
  - auth/docker-compose.yml
#  - swag/docker-compose.yaml

networks:
  mcp-net:
    name: ${MCP_NETWORK:-mcp-oauth}
    external: true
  jakenet:
    external: true

volumes:
  mcp-oauth-logs:
  mcp-oauth-redis-data:
