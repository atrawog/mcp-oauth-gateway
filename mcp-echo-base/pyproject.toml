[project]
name = "mcp-echo-base"
version = "1.0.0"
description = "Base class for MCP Echo Server implementations (stateful and stateless)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.27.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
