## MCP OAuth Gateway - SWAG Reverse Proxy Template
## Copy this file, replace all {{PLACEHOLDERS}}, and save as:
##   /mnt/appdata/swag/nginx/proxy-confs/{{SERVICE_NAME}}.subdomain.conf
##
## Placeholders:
##   {{SERVICE_NAME}}    - e.g. axon, synapse, unraid
##   {{DOMAIN}}          - e.g. axon.tootie.tv
##   {{UPSTREAM_IP}}     - e.g. 100.75.111.118 (Tailscale IP)
##   {{UPSTREAM_PORT}}   - e.g. 3002 (host-exposed port)
##   {{AUTH_DOMAIN}}     - e.g. mcp-auth.tootie.tv

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name {{DOMAIN}};

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    set $upstream_app {{UPSTREAM_IP}};
    set $upstream_port {{UPSTREAM_PORT}};
    set $upstream_proto http;

    set $mcp_upstream_app {{UPSTREAM_IP}};
    set $mcp_upstream_port {{UPSTREAM_PORT}};
    set $mcp_upstream_proto http;

    # DNS Rebinding Protection
    set $origin_valid 0;
    if ($http_origin = "") {
        set $origin_valid 1;
    }
    if ($http_origin = "https://$server_name") {
        set $origin_valid 1;
    }
    if ($http_origin ~ "^https://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
        set $origin_valid 1;
    }
    # Allow Anthropic MCP proxy and Claude.ai
    if ($http_origin ~ "^https://(.*\.)?anthropic\.com$") {
        set $origin_valid 1;
    }
    if ($http_origin ~ "^https://(.*\.)?claude\.ai$") {
        set $origin_valid 1;
    }

    add_header X-MCP-Version "2025-06-18" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # OAuth 2.1 token verification via mcp-oauth
    location = /_oauth_verify {
        internal;
        include /config/nginx/resolver.conf;
        proxy_pass http://mcp-oauth:8000/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # ──────────────────────────────────────────────
    # MCP endpoint (authenticated via mcp-oauth)
    # ──────────────────────────────────────────────
    location /mcp {
        if ($origin_valid = 0) {
            add_header Content-Type "application/json" always;
            return 403 '{"error": "origin_not_allowed", "message": "Origin header validation failed"}';
        }

        # Protocol version validation: disabled - let MCP servers negotiate
        auth_request /_oauth_verify;
        auth_request_set $auth_status    $upstream_status;
        auth_request_set $auth_user_id   $upstream_http_x_user_id;
        auth_request_set $auth_user      $upstream_http_x_user_name;
        auth_request_set $auth_token     $upstream_http_x_auth_token;

        include /config/nginx/resolver.conf;
        proxy_buffering off;
        include /config/nginx/mcp.conf;

        proxy_max_temp_file_size 0;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';

        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header Accept $http_accept;
        proxy_set_header X-User-Id    $auth_user_id;
        proxy_set_header X-User-Name  $auth_user;
        proxy_set_header X-Auth-Token $auth_token;

        proxy_connect_timeout 240s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # CORS headers (shared snippet — origin already validated above via $origin_valid)
        include /config/nginx/proxy-confs/_cors_headers.conf;

        if ($request_method = 'OPTIONS') {
            add_header Content-Type "text/plain charset=UTF-8";
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
    }

    # ──────────────────────────────────────────────
    # OAuth metadata (static + proxied to mcp-oauth)
    # ──────────────────────────────────────────────
    location = /.well-known/oauth-protected-resource {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        return 200 '{"resource":"https://{{DOMAIN}}","authorization_servers":["https://{{AUTH_DOMAIN}}"],"scopes_supported":["mcp:read","mcp:write"],"bearer_methods_supported":["header"]}';
    }

    location = /.well-known/oauth-authorization-server {
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;
        add_header Cache-Control "public, max-age=3600" always;
        proxy_pass http://mcp-oauth:8000;
    }

    location = /.well-known/oauth-client-id-metadata {
        # Public endpoint — no auth_request (used by MCP clients to bootstrap OAuth 2025-11-25)
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;
        add_header Cache-Control "public, max-age=3600" always;
        proxy_pass http://mcp-oauth:8000;
    }

    location = /.well-known/openid-configuration {
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;
        add_header Cache-Control "public, max-age=3600" always;
        proxy_pass http://mcp-oauth:8000;
    }

    location = /jwks {
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;
        add_header Cache-Control "public, max-age=3600" always;
        proxy_pass http://mcp-oauth:8000;
    }

    # ──────────────────────────────────────────────
    # OAuth endpoints (proxied to mcp-oauth)
    # ──────────────────────────────────────────────
    location = /register {
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://mcp-oauth:8000;
    }

    location = /authorize {
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;
        proxy_pass http://mcp-oauth:8000;
    }

    # Device flow endpoints (RFC 8628 - no auth required)
    location = /device/code {
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://mcp-oauth:8000;
    }

    location ~ ^/activate {
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;
        proxy_pass http://mcp-oauth:8000;
    }

    location = /device/success {
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;
        proxy_pass http://mcp-oauth:8000;
    }

    location = /token {
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://mcp-oauth:8000;
    }

    location = /revoke {
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://mcp-oauth:8000;
    }

    location = /callback {
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;
        proxy_pass http://mcp-oauth:8000;
    }

    location = /success {
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;
        proxy_pass http://mcp-oauth:8000;
    }

    # ──────────────────────────────────────────────
    # Health check
    # ──────────────────────────────────────────────
    location /health {
        include /config/nginx/resolver.conf;
        include /config/nginx/mcp.conf;

        proxy_set_header Accept "application/json";
        proxy_set_header X-Health-Check "nginx-mcp-proxy";
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;

        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # ──────────────────────────────────────────────
    # Session + default (authenticated)
    # ──────────────────────────────────────────────
    location ~* ^/(session|sessions) {
        auth_request /_oauth_verify;
        auth_request_set $auth_status    $upstream_status;
        auth_request_set $auth_user_id   $upstream_http_x_user_id;
        auth_request_set $auth_user      $upstream_http_x_user_name;
        auth_request_set $auth_token     $upstream_http_x_auth_token;
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;

        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header X-User-Id    $auth_user_id;
        proxy_set_header X-User-Name  $auth_user;
        proxy_set_header X-Auth-Token $auth_token;

        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;

        proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
    }

    location / {
        auth_request /_oauth_verify;
        auth_request_set $auth_status    $upstream_status;
        auth_request_set $auth_user_id   $upstream_http_x_user_id;
        auth_request_set $auth_user      $upstream_http_x_user_name;
        auth_request_set $auth_token     $upstream_http_x_auth_token;
        include /config/nginx/resolver.conf;
        include /config/nginx/proxy.conf;

        proxy_set_header X-User-Id    $auth_user_id;
        proxy_set_header X-User-Name  $auth_user;
        proxy_set_header X-Auth-Token $auth_token;

        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # ──────────────────────────────────────────────
    # Error pages (JSON)
    # ──────────────────────────────────────────────
    error_page 400 @error_400;
    error_page 401 @error_401;
    error_page 403 @error_403;

    location @error_400 {
        internal;
        add_header Content-Type "application/json" always;
        return 400 '{"error": "bad_request", "message": "Invalid request format or missing required headers"}';
    }

    location @error_401 {
        internal;
        add_header Content-Type "application/json" always;
        add_header WWW-Authenticate 'Bearer resource_metadata="https://$server_name/.well-known/oauth-protected-resource", scope="mcp:read mcp:write"' always;
        return 401 '{"error": "unauthorized", "message": "Valid authorization token required", "authorization_server": "https://$server_name/.well-known/oauth-authorization-server"}';
    }

    location @error_403 {
        internal;
        add_header Content-Type "application/json" always;
        return 403 '{"error": "forbidden", "message": "Insufficient permissions or origin not allowed"}';
    }
}
